name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dnsshimple
          POSTGRES_PASSWORD: dnsshimple
          POSTGRES_DB: dnsshimple
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U dnsshimple"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Without a reachable database the Postgres suites skip; CI must run
      # them, not skip them.
      DNSSHIMPLE_TEST_DATABASE_URL: postgres://dnsshimple:dnsshimple@localhost:5433/dnsshimple_test
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4 # installs the toolchain pinned in mise.toml
      - run: mise exec -- go vet ./...
      - run: mise exec -- gotestsum -- -race ./...
      - run: mise exec -- golangci-lint run
      - run: mise exec -- go run golang.org/x/vuln/cmd/govulncheck@latest ./...
