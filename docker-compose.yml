# Local development and grey-box test database. Port 5433 on purpose: it must
# not collide with any Postgres already living on 5432.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: dnsshimple
      POSTGRES_PASSWORD: dnsshimple
      POSTGRES_DB: dnsshimple
    ports:
      - "5433:5432"
    volumes:
      # Named volume: linked tenants must survive container recreation.
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dnsshimple"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  postgres-data:
