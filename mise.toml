[tools]
age = "1.3.1"
# Pinned to the exact patch: 1.26.4 ships GO-2026-5856 (crypto/tls ECH leak,
# reachable from our HTTP listeners and client) and GO-2026-4970 (os root
# escape). Dependabot/govulncheck watch for the next bump.
go = "1.26.5"
golangci-lint = "latest"
gotestsum = "latest"

# No CGO_ENABLED=0 here: -race needs cgo on Linux, so a global export breaks
# CI. Static binaries set it in the release build command instead.
